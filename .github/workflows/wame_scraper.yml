name: Wame Calendar Scraper

on:
  schedule:
    # UTC 20:12 = 한국 시간 다음 날 05:12
    - cron: '12 20 * * *'
  workflow_dispatch: # 수동 실행 버튼 활성화

permissions:
  contents: write   # keepalive 커밋을 push 하기 위해 필요

# 이전 실행이 안 끝났는데 새로 뜨는 상황 방지 (중복 적재/시트 경합 차단)
concurrency:
  group: wame-scraper
  cancel-in-progress: false

jobs:
  run-scraper:
    # ubuntu-latest는 2026-10-19부터 Ubuntu 26으로 자동 전환됨.
    # Playwright 시스템 의존성이 바뀔 수 있어 명시적으로 고정한다.
    # 전환 시에는 수동 실행으로 ubuntu-26 검증 후 올릴 것.
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install playwright beautifulsoup4 gspread requests

    - name: Install Playwright Browsers
      run: playwright install chromium

    - name: Run Scraper Script
      env:
        # GitHub Secrets에 등록할 구글 API 키를 환경변수로 전달
        GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
      run: python data.py

    - name: 저장소 활동 기록 (스케줄 자동 비활성화 방지)
      if: always()
      run: |
        mkdir -p .github
        date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/.keepalive-wame
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add .github/.keepalive-wame
        git diff --cached --quiet && exit 0
        git commit -m "chore: keepalive (wame)"
        for i in 1 2 3; do
          git pull --rebase --autostash && git push && exit 0
          sleep $((RANDOM % 10 + 5))
        done
        echo "keepalive push 실패 (본 작업에는 영향 없음)"
