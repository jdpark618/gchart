name: Wame Calendar Scraper

on:
  schedule:
    # 한국 시간 기준 매일 오전 8시 실행 (UTC 기준 전날 오후 11시)
    - cron: '12 20 * * *'
  workflow_dispatch: # 수동 실행 버튼 활성화

permissions:
  contents: write   # keepalive 커밋을 push 하기 위해 필요

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install playwright beautifulsoup4 gspread oauth2client
        
    - name: Install Playwright Browsers
      run: playwright install chromium

    - name: Run Scraper Script
      env:
        # GitHub Secrets에 등록할 구글 API 키를 환경변수로 전달
        GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
      run: python data.py

      # 기존 파이썬 실행 스텝들...

    - name: 저장소 활동 기록 (스케줄 자동 비활성화 방지)
      if: always()
      run: |
        mkdir -p .github
        date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/.keepalive
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add .github/.keepalive
        git diff --cached --quiet || git commit -m "chore: keepalive"
        git pull --rebase --autostash
        git push
