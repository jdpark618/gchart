name: Ad Tracker (마케팅 추적)
# 게임 하나의 KR 광고(Meta · Google)를 모아 data/ads/ 에 저장 → 사이트가 Pages 로 읽음 (tracker/ad_track.py 설명 참고)
# 실행: 순위 수집(인기·매출)이 끝나면 바로 자동(그날 인기 TOP5 + 매출 TOP5, tracker/daily_top5.py) · 05:30/12:30 예약은 안전망 · Actions 탭에서 수동 실행(게임명 · 패키지명 입력) · tracker/test.json 수정 후 push
on:
  workflow_dispatch:
    inputs:
      name: { description: '게임명 · Meta 검색어 (여러 개면 쉼표로, 첫 값이 표시 이름 예: 먼작귀 포켓, 먼작귀, 치이카와) — 비우면 오늘 TOP5 전체', required: false, default: '' }
      pkg: { description: 'Google Play 패키지명 (예 com.survivor.ace) — 비우면 오늘 인기·매출 TOP5 전체 추적', required: false, default: '' }
      google_adv: { description: 'Google 광고주 검색어 (퍼블리셔명, 비우면 Google 건너뜀)', default: '' }
      meta_page: { description: 'Meta 페이지 ID (알면 입력, 비우면 자동)', default: '' }
      google_adv_id: { description: 'Google 광고주 ID AR... (알면 입력)', default: '' }
  push:
    branches: [main]
    paths: ['tracker/test.json', 'tracker/daily_top5.py']   # daily_top5.py 를 고쳐 push 하면 그날 TOP5 를 바로 한 번 추적
  # 순위 수집(Daily PlayStore Rank Scraper)이 끝나면 바로 (11/12): 시각 예약은 GitHub 대기열에서 3~6시간 밀려 순위와 엇갈림 → 순위를 따라감
  #   순위가 늦게 돌거나 재시도·예비 예약으로 성공해도 그 완료에 맞춰 시작 · 오늘 순위가 아직 없으면 daily_top5.py 가 기록 없이 끝내 다음 기회에 다시
  workflow_run:
    workflows: ['Daily PlayStore Rank Scraper']
    types: [completed]
  schedule:   # 안전망: 위 연결이 안 돈 날만 실제로 추적 (이미 성공했으면 gate 에서 끝남)
    - cron: '30 3 * * *'    # 예비: 원래 + 7시간 = KST 12:30 (11/10) · 오늘 이미 성공했으면 gate 에서 끝남
    - cron: '30 20 * * *'   # 매일 05:30 KST — GitHub 예약이 3~4시간 밀려 실제로는 9시 무렵 · 순위 수집(실제 7시 반 무렵) 뒤에 그날 TOP5 로 추적 (11/09)
concurrency: { group: ad-track, cancel-in-progress: false }
permissions:
  contents: write
jobs:
  # 관문 (11/10, 11/12 순위 완료 연결 추가): 예약 · 순위 완료로 시작했을 때 오늘 이미 성공했으면 여기서 끝냄 · 수동 실행은 항상 진행
  gate:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.g.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'schedule' || github.event_name == 'workflow_run'
      - id: g
        if: github.event_name == 'schedule' || github.event_name == 'workflow_run'
        run: python3 gate.py ads

  track:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # push 때 바뀐 파일을 보고 TOP5 / test.json 중 고르기 위함
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install playwright==1.48.0 pillow && python -m playwright install --with-deps chromium
      - name: Track
        env:
          IN_NAME: ${{ inputs.name }}
          IN_PKG: ${{ inputs.pkg }}
          IN_GADV: ${{ inputs.google_adv }}
          IN_MPAGE: ${{ inputs.meta_page }}
          IN_GADVID: ${{ inputs.google_adv_id }}
          EVENT: ${{ github.event_name }}
        run: |
          CHANGED=$( [ "$EVENT" = "push" ] && git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null || true )
          # 매일 TOP5: 순위 완료 · 예약 · 수동 실행(입력 비움) · daily_top5.py 를 고친 push  /  test.json push = 시험 목록  /  패키지 입력 = 그 게임 하나 (11/10)
          if [ "$EVENT" = "schedule" ] || [ "$EVENT" = "workflow_run" ] || { [ "$EVENT" = "workflow_dispatch" ] && [ -z "$IN_PKG" ]; } || { [ "$EVENT" = "push" ] && echo "$CHANGED" | grep -q 'tracker/daily_top5.py' && ! echo "$CHANGED" | grep -q 'tracker/test.json'; }; then
            python tracker/daily_top5.py   # 매일: 그날 인기 TOP5 + 매출 TOP5 (Play · 한국)
          elif [ -n "$IN_PKG" ]; then
            python tracker/ad_track.py --name "$IN_NAME" --pkg "$IN_PKG" --google-adv "$IN_GADV" --meta-page "$IN_MPAGE" --google-adv-id "$IN_GADVID"
          else
            python - <<'PY'
          import json, subprocess
          for g in json.load(open('tracker/test.json', encoding='utf-8')):
              subprocess.run(['python', 'tracker/ad_track.py', '--name', g['name'], '--pkg', g['pkg'], '--google-adv', g.get('google_adv', ''),
                              '--meta-page', g.get('meta_page', ''), '--google-adv-id', g.get('google_adv_id', ''), '--ios', g.get('ios', '')], check=False)
          PY
          fi
      - name: Save to main (Pages)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ads data/runlog 2>/dev/null || git add data/ads   # 수집 로그 (/admin, 11/09)
          git diff --cached --quiet && { echo "변경 없음"; exit 0; }
          git commit -qm "ads: 마케팅 추적 결과 $(date -u +%FT%TZ)"
          for i in 1 2 3 4 5; do git pull --rebase --autostash -q && git push -q && exit 0; sleep $((i*5)); done
          exit 1
