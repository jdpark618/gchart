name: Game News (게임 뉴스)

# 루리웹 플랫폼별 뉴스 섹션 → data/news/YYYY-MM.json (대시보드 게임 뉴스). 3시간마다 + 수동 실행 (11/20)
# 11/25: Google Cloud Scheduler(작업 이름 ads-backup, 40 */3 KST)가 workflow_dispatch 로 부름.
#        GitHub 예약은 하루 8번 중 2번 정도만 돌아서 뺌 (같이 두면 늦게 도는 중복 실행이 수집 로그에 섞임)
on:
  workflow_dispatch:

concurrency: { group: news, cancel-in-progress: false }
permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python news.py
      - name: Save (바뀐 경우만)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news data/runlog   # 수집 로그 (/admin 뉴스 줄, 11/25) · 실행마다 커밋됨
          git diff --cached --quiet && { echo "변경 없음"; exit 0; }
          git commit -qm "news: 게임 뉴스 갱신 $(date -u +%FT%TZ)"
          for i in 1 2 3 4 5; do git pull --rebase --autostash -q && git push -q && exit 0; sleep $((i*5)); done
          exit 1
