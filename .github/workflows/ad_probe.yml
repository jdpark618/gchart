name: Ad Tracker Probe (검증용)
# 광고 추적 1단계 검증: Actions 서버에서 Meta/Google 광고 데이터가 수집되는지만 확인.
# 결과는 ad-probe 브랜치의 probe/result.json (main 은 건드리지 않음). 검증이 끝나면 이 파일은 지운다.
on:
  workflow_dispatch:
    inputs:
      meta_query: { description: 'Meta 검색어', default: '탕탕에이스' }
      google_adv: { description: 'Google 광고주 검색어', default: '카카오게임즈' }
      google_pkg: { description: 'Google 패키지명', default: 'com.kakaogames.dokkaebi' }
  push:
    branches: [main]
    paths: ['probe/**', '.github/workflows/ad_probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install playwright==1.48.0 && python -m playwright install --with-deps chromium
      - name: Probe
        run: python probe/ad_probe.py "${{ inputs.meta_query || '탕탕에이스' }}" "${{ inputs.google_adv || '카카오게임즈' }}" "${{ inputs.google_pkg || 'com.kakaogames.dokkaebi' }}"
      - name: Save result to ad-probe branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp probe/result.json /tmp/result.json 2>/dev/null || echo '{"error":"no result"}' > /tmp/result.json
          git fetch origin ad-probe || true
          git checkout -B ad-probe
          git rm -rq --cached . > /dev/null
          mkdir -p out && cp /tmp/result.json out/result.json
          git add out/result.json
          git commit -qm "probe result $(date -u +%FT%TZ)"
          git push -fq origin ad-probe
