name: Daily PlayStore Rank Scraper

on:
  schedule:
    - cron: '12 20 * * *'
  workflow_dispatch: 

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 체크아웃
      uses: actions/checkout@v4

    - name: Node.js 환경 설정
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: 라이브러리 설치
      run: npm install google-play-scraper@9.2.0 google-spreadsheet google-auth-library

    - name: 스크립트 강제 생성 및 실행
      env:
        GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        SHEET_URL: ${{ secrets.SHEET_URL }}
      run: |
        cat << 'EOF' > run.js
        const { GoogleSpreadsheet } = require('google-spreadsheet');
        const { JWT } = require('google-auth-library');
        const gplay = require('google-play-scraper');

        async function processCategory(doc, docId, todayStr, yesterdayStr, collectionType, sheetNameSuffix) {
            const dbSheetName = `DB_${sheetNameSuffix}`;

            let dbSheet = doc.sheetsByTitle[dbSheetName];
            if (!dbSheet) {
                const dbHeaders = ["날짜", "순위", "증감", "앱이름", "장르", "개발사(퍼블리셔)", "증감수치", "평점"];
                dbSheet = await doc.addSheet({ title: dbSheetName, headerValues: dbHeaders });
            }

            // 1. 과거 유효 데이터 캐싱
            let previousRanks = {};
            let latestKnownScores = {};

            const rows = await dbSheet.getRows();
            for (const row of rows) {
                const rowDate = row.get('날짜');
                const appName = row.get('앱이름');
                const rank = row.get('순위');
                const score = row.get('평점');

                if (appName) {
                    if (rowDate === yesterdayStr && rank) {
                        previousRanks[appName] = parseInt(rank, 10);
                    }
                    if (score && score !== '-' && score !== '0' && score !== '') {
                        latestKnownScores[appName] = score;
                    }
                }
            }

            // 2. 플레이스토어 랭킹 수집 (리스트 단계에서 평점 포함됨)
            const topGamesList = await gplay.list({
                category: gplay.category.GAME,
                collection: collectionType,
                num: 100,
                country: 'kr',
                lang: 'ko'
            });

            // 3. 앱 상세 정보 수집 (list 평점을 기본으로 삼고 app 상세로 보완)
            const topGames = [];
            process.stdout.write(`  - ${sheetNameSuffix} 장르 및 평점 데이터 수집 중...`);
            for (let i = 0; i < topGamesList.length; i += 10) {
                const chunk = topGamesList.slice(i, i + 10);
                const promises = chunk.map(async (game) => {
                    // 리스트에서 제공하는 score를 기본값으로 확보 (성인앱 차단 우회)
                    let rawScore = (typeof game.score === 'number' && game.score > 0) ? game.score : null;

                    try {
                        const detail = await gplay.app({ appId: game.appId, country: 'kr', lang: 'ko' });
                        game.genre = detail.genre || '기타';
                        if (typeof detail.score === 'number' && detail.score > 0) {
                            rawScore = detail.score;
                        }
                    } catch (e) {
                        game.genre = '기타';
                        // 상세 조회 실패 시에도 리스트에서 얻은 rawScore 유지
                    }

                    game.finalScore = (rawScore && rawScore > 0) ? rawScore.toFixed(1) : null;
                    return game;
                });
                const results = await Promise.all(promises);
                topGames.push(...results);
                process.stdout.write('.');
                await new Promise(r => setTimeout(r, 400));
            }
            console.log(" 완료!");

            // 4. 데이터 조립 (A~H열 순수 2차원 배열 매핑)
            const rawRows = [];
            for (let i = 0; i < topGames.length; i++) {
                const rank = i + 1;
                const title = topGames[i].title;
                const genre = topGames[i].genre;
                const developer = topGames[i].developer ? `'${topGames[i].developer}` : `'알 수 없음`; 
                
                // 수집된 평점이 없으면 과거 누적 최신 평점 승계, 그래도 없으면 '-'
                let score = topGames[i].finalScore;
                if (!score && latestKnownScores[title]) {
                    score = latestKnownScores[title];
                }
                if (!score) {
                    score = '-';
                }
                
                let change = 'NEW';
                if (previousRanks[title]) {
                    const diff = previousRanks[title] - rank;
                    if (diff > 0) change = `▲ ${diff}`;
                    else if (diff < 0) change = `▼ ${Math.abs(diff)}`;
                    else change = '-';
                }

                rawRows.push([
                    todayStr,
                    rank,
                    change,
                    title,
                    genre,
                    developer,
                    '',       
                    score     
                ]);
            }

            if (rawRows.length > 0) {
                await dbSheet.addRows(rawRows, { raw: true });
                console.log(`[완료] ${sheetNameSuffix} DB 시트에 데이터 기록 완료!`);
            }
        }

        async function main() {
            const creds = JSON.parse(process.env.GCP_CREDENTIALS);
            const serviceAccountAuth = new JWT({
                email: creds.client_email,
                key: creds.private_key,
                scopes: ['https://www.googleapis.com/auth/spreadsheets'],
            });

            const sheetUrl = process.env.SHEET_URL;
            const docId = sheetUrl.match(/\/d\/([a-zA-Z0-9-_]+)/)[1];
            const doc = new GoogleSpreadsheet(docId, serviceAccountAuth);
            await doc.loadInfo();

            const now = new Date(new Date().getTime() + 9 * 60 * 60 * 1000); 
            const todayStr = now.toISOString().split('T')[0];
            const yesterdayStr = new Date(now.getTime() - 24 * 60 * 60 * 1000).toISOString().split('T')[0];

            console.log("=== 1. 게임 인기순위 수집 시작 ===");
            await processCategory(doc, docId, todayStr, yesterdayStr, gplay.collection.TOP_FREE, '인기순위');

            console.log("\n=== 2. 게임 매출순위 수집 시작 ===");
            await processCategory(doc, docId, todayStr, yesterdayStr, gplay.collection.GROSSING, '매출순위');
        }

        main().catch(console.error);
        EOF
        
        node run.js
