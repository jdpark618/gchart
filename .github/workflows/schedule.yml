name: Daily PlayStore Rank Scraper

on:
  schedule:
    # UTC 20:42 = 한국 시간 다음 날 05:42
    # wame 크롤러(20:12)와 30분 간격을 둬 keepalive push 충돌을 피한다
    - cron: '42 20 * * *'
  workflow_dispatch:
    inputs:
      appinfo_only:
        description: '앱 정보(설명·스크린샷)만 채우기 — 순위 수집·기록은 하지 않음'
        type: boolean
        default: false

permissions:
  contents: write   # keepalive 커밋을 push 하기 위해 필요

# 이전 실행이 안 끝났는데 새로 뜨는 상황 방지 (중복 적재 차단)
concurrency:
  group: playstore-rank-scraper
  cancel-in-progress: false

jobs:
  scrape-and-update:
    # ubuntu-latest는 2026-10-19부터 Ubuntu 26으로 자동 전환됨
    runs-on: ubuntu-24.04

    steps:
    - name: 저장소 체크아웃
      uses: actions/checkout@v5

    - name: Node.js 환경 설정
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        # 이 저장소엔 package.json/lock 파일이 없으므로 자동 캐싱을 끈다
        package-manager-cache: false

    - name: 라이브러리 설치
      run: npm install google-play-scraper@9.2.0 google-spreadsheet@5.3.0 google-auth-library

    - name: 스크립트 강제 생성 및 실행
      env:
        GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        SHEET_URL: ${{ secrets.SHEET_URL }}
        APPINFO_ONLY: ${{ inputs.appinfo_only && '1' || '' }}
      run: |
        cat << 'EOF' > run.js
        const { GoogleSpreadsheet } = require('google-spreadsheet');
        const { JWT } = require('google-auth-library');
        const gplay = require('google-play-scraper');
        const fs = require('fs');

        // ── 조회 윈도우 설정 ──────────────────────────────────────
        // 필요한 과거 데이터는 두 가지뿐이다.
        //   1) 증감 계산용 = 어제 1일치
        //   2) 평점 폴백용 = 최근 이력 중 유효한 마지막 값
        // 따라서 DB 전체가 아니라 최근 LOOKBACK_DAYS 일치만 읽는다.
        const LOOKBACK_DAYS = 14;
        const ROWS_PER_DAY = 100;

        // ── 수집 국가 ─────────────────────────────────────────────
        // 한국은 접미사 없는 기존 시트(DB_매출순위·DB_앱정보)를 그대로 쓰고, 다른 나라는 DB_매출순위_US 처럼 나라별 시트.
        // 앱이름·설명·스크린샷은 그 나라 스토어 언어 그대로 받는다 (미국=영어, 일본=일본어, 대만=번체).
        // 장르만은 사이트의 장르 색·필터가 맞도록 genreId 를 한국어 분류명으로 바꿔 적는다.
        // 날짜는 나라와 상관없이 수집한 날의 한국 날짜.
        // shotAlt = 스토어 페이지에서 스크린샷 이미지의 alt 문구 (상세 조회 실패 시 폴백용, 언어마다 다름)
        const COUNTRIES = [
            { code: 'kr', suffix: '',    name: '한국', lang: 'ko',    shotAlt: '스크린샷 이미지' },
            { code: 'us', suffix: '_US', name: '미국', lang: 'en',    shotAlt: 'Screenshot image' },
            { code: 'jp', suffix: '_JP', name: '일본', lang: 'ja',    shotAlt: 'スクリーンショット画像' },
            { code: 'tw', suffix: '_TW', name: '대만', lang: 'zh-TW', shotAlt: '螢幕截圖圖片' },
        ];

        // ── 앱 정보 (게임 설명·스크린샷) ──────────────────────────
        // 순위 수집 때 받은 상세 조회 결과에서 설명·스크린샷만 모아 나라별 DB_앱정보(_US…) 시트에 게임당 한 줄로 저장한다.
        // 사이트의 게임 상세 창이 패키지명으로 한 줄만 읽어 간다. 순위 시트와는 따로라 실패해도 순위 기록에 영향 없음.
        const APPINFO_SHEET = 'DB_앱정보';   // + 나라 접미사
        const APPINFO_HEADERS = ['패키지명', '앱이름', '설명', '스크린샷', '갱신일'];
        const APPINFO_SHOTS = 6;
        const appInfoBy = {};   // 나라 코드 → { 패키지명 → 정보 }
        const infoOf = code => (appInfoBy[code] ||= {});
        function keepAppInfo(country, appId, title, detail) {
            if (!appId || !detail) return;
            const shots = (detail.screenshots || []).filter(u => typeof u === 'string' && u.startsWith('http')).slice(0, APPINFO_SHOTS);
            const desc = String(detail.description || '').trim();
            if (desc || shots.length) infoOf(country.code)[appId] = { title, desc, shots };
        }
        // 상세 조회가 실패하는 게임(장르 폴백과 같은 게임들)은 스토어 페이지에서 직접 읽는다.
        // 설명 = data-g-id="description" 블록(<br> → 줄바꿈), 스크린샷 = alt 가 그 나라 언어의 '스크린샷 이미지'인 이미지 (크기 접미사 뗀 주소)
        function decodeHtml(t) {
            return t.replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '')
                .replace(/&#(\d+);/g, (_, n) => String.fromCodePoint(+n)).replace(/&#x([0-9a-f]+);/gi, (_, n) => String.fromCodePoint(parseInt(n, 16)))
                .replace(/&quot;/g, '"').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&');
        }
        async function appInfoFromPage(country, appId, title) {
            try {
                const res = await fetch(`https://play.google.com/store/apps/details?id=${encodeURIComponent(appId)}&hl=${country.lang}&gl=${country.code}`);
                if (!res.ok) return false;
                const html = await res.text();
                const m = html.match(/data-g-id="description"[^>]*>([\s\S]*?)<\/div>/);
                const desc = m ? decodeHtml(m[1]).trim() : '';
                const shots = [...new Set([...html.matchAll(/<img src="(https:\/\/play-lh\.googleusercontent\.com\/[^"=]+)=[^"]*"[^>]*alt="([^"]*)"/g)]
                    .filter(x => x[2] === country.shotAlt).map(x => x[1]))].slice(0, APPINFO_SHOTS);
                if (!desc && !shots.length) return false;
                infoOf(country.code)[appId] = { title, desc, shots };
                return true;
            } catch (e) {
                return false;
            }
        }

        // ── 장르 폴백 ──────────────────────────────────────────────
        // gplay.app 상세 조회가 일부 게임(주로 청소년 이용불가 MMO)에서 매번 실패해
        // 장르가 '기타'로 쌓였다. 상세 조회가 실패하면 스토어 페이지의 applicationCategory를
        // 직접 읽고, 그래도 없으면 최근 이력의 마지막 장르를 쓴다.
        const GENRE_KO = {
            GAME_ACTION: '액션', GAME_ADVENTURE: '어드벤처', GAME_ARCADE: '아케이드', GAME_BOARD: '보드',
            GAME_CARD: '카드', GAME_CASINO: '카지노', GAME_CASUAL: '캐주얼', GAME_EDUCATIONAL: '교육',
            GAME_MUSIC: '음악', GAME_PUZZLE: '퍼즐', GAME_RACING: '레이싱', GAME_ROLE_PLAYING: '롤플레잉',
            GAME_SIMULATION: '시뮬레이션', GAME_SPORTS: '스포츠', GAME_STRATEGY: '전략', GAME_TRIVIA: '퀴즈', GAME_WORD: '단어'
        };
        async function genreFromPage(appId, gl = 'kr') {
            try {
                const res = await fetch(`https://play.google.com/store/apps/details?id=${encodeURIComponent(appId)}&hl=ko&gl=${gl}`);
                if (!res.ok) return null;
                const m = (await res.text()).match(/"applicationCategory":"(GAME_[A-Z_]+)"/);
                return m ? (GENRE_KO[m[1]] || null) : null;
            } catch (e) {
                return null;
            }
        }

        function addDays(dateStr, delta) {
            const d = new Date(`${dateStr}T00:00:00Z`);
            d.setUTCDate(d.getUTCDate() + delta);
            return d.toISOString().split('T')[0];
        }

        /**
         * 날짜 컬럼(A)만 먼저 읽어 윈도우의 시작 위치를 찾은 뒤,
         * 그 구간의 행만 getRows로 가져온다.
         * 시트 끝부분만 탐침하고, 탐침 범위가 부족하면 전체 스캔으로 폴백한다.
         */
        async function loadRecentRows(dbSheet, cutoffStr) {
            const gridRows = dbSheet.rowCount;
            if (gridRows < 2) return { rows: [], scanned: 0, mode: 'empty' };

            const probeRows = LOOKBACK_DAYS * ROWS_PER_DAY * 2 + 200;
            let startRow = Math.max(2, gridRows - probeRows);
            let dateCol = null;
            let mode = 'probe';

            if (startRow > 2) {
                dateCol = await dbSheet.getCellsInRange(`A${startRow}:A${gridRows}`);
                const first = (dateCol && dateCol[0] && dateCol[0][0]) ? dateCol[0][0] : '';
                // 탐침 구간이 비었거나(데이터가 훨씬 앞에서 끝남),
                // 구간 시작이 이미 cutoff 이후라면(충분히 과거까지 못 감) 전체 스캔
                if (!dateCol || dateCol.length === 0 || first > cutoffStr) {
                    dateCol = null;
                }
            }

            if (!dateCol) {
                startRow = 2;
                mode = 'full';
                dateCol = await dbSheet.getCellsInRange(`A2:A${gridRows}`);
            }

            if (!dateCol || dateCol.length === 0) return { rows: [], scanned: 0, mode: 'empty' };

            let idx = dateCol.findIndex(r => ((r && r[0]) ? r[0] : '') >= cutoffStr);
            if (idx === -1) {
                // cutoff 이후 데이터가 전혀 없음 → 최소한 끝부분만 확보
                idx = Math.max(0, dateCol.length - ROWS_PER_DAY * 2);
            }

            const offset = (startRow - 2) + idx;
            const limit = dateCol.length - idx;
            const rows = await dbSheet.getRows({ offset, limit });

            return { rows, scanned: dateCol.length, mode, offset, limit };
        }

        // ── 사이트용 스냅샷 (data/snapshot.json) ──────────────────
        // 사이트가 구글 시트를 수십 번 조회하지 않도록, 4개국 × 2스토어의 최신 차트와 최근 앱 목록을
        // 수집 중에 이미 읽은 행으로 만들어 GitHub Pages 에 올린다 (시트 API 를 더 부르지 않음).
        // 행 모양은 시트와 같은 10칸: [날짜, 순위, 증감, 앱이름, 패키지명, 장르, 퍼블리셔, 증감수치, 평점, 아이콘]
        const snapRows = {};
        const unq = v => String(v ?? '').replace(/^'/, '').trim();
        function snapAdd(sheetName, arr) { (snapRows[sheetName] ||= []).push(...arr); }
        const rowToArr = r => [unq(r.get('날짜')), Number(r.get('순위')) || 0, unq(r.get('증감')), unq(r.get('앱이름')), unq(r.get('패키지명')), unq(r.get('장르')), unq(r.get('개발사(퍼블리셔)')), unq(r.get('증감수치')), unq(r.get('평점')), unq(r.get('아이콘url'))];
        const objToArr = o => [unq(o['날짜']), Number(o['순위']) || 0, unq(o['증감']), unq(o['앱이름']), unq(o['패키지명']), unq(o['장르']), unq(o['개발사(퍼블리셔)']), unq(o['증감수치']), unq(o['평점']), unq(o['아이콘url'])];
        function exportSnapshot(todayStr) {
            const snap = { v: new Date().toISOString(), today: todayStr, charts: {}, apps: {} };
            for (const st of ['gp', 'ios']) for (const country of COUNTRIES) for (const [k, base] of [['sales', '매출순위'], ['popular', '인기순위']]) {
                const arr = snapRows[`DB_${base}${st === 'ios' ? '_iOS' : ''}${country.suffix}`];
                if (!arr || !arr.length) continue;
                const latest = arr.reduce((m, r) => r[0] > m ? r[0] : m, '');
                ((snap.charts[st] ||= {})[country.code] ||= {})[k] = { date: latest, rows: arr.filter(r => r[0] === latest).sort((a, b) => a[1] - b[1]) };
                const apps = ((snap.apps[st] ||= {})[country.code] ||= {});   // 패키지명 → [이름, 퍼블리셔, 마지막 날짜]
                arr.forEach(r => { if (!r[4].includes('.')) return; const a = apps[r[4]]; if (!a || r[0] >= a[2]) apps[r[4]] = [r[3], r[6], r[0]]; });
            }
            fs.mkdirSync('data', { recursive: true });
            fs.writeFileSync('data/snapshot.json', JSON.stringify(snap));
            fs.writeFileSync('data/version.json', JSON.stringify({ v: snap.v, today: todayStr }));
            const n = Object.values(snap.charts).flatMap(x => Object.values(x)).flatMap(x => Object.values(x)).length;
            console.log(`  - data/snapshot.json: 차트 ${n}개 · ${Math.round(fs.statSync('data/snapshot.json').size / 1024)}KB`);
        }

        const EXPECTED_RANKS = 100;
        const shortfalls = [];   // 수집 건수가 모자란 차트 (main 끝에서 실패 처리)

        async function processCategory(doc, docId, todayStr, yesterdayStr, collectionType, sheetNameSuffix, country) {
            const dbSheetName = `DB_${sheetNameSuffix}${country.suffix}`;
            const label = `${country.name} ${sheetNameSuffix}`;

            let dbSheet = doc.sheetsByTitle[dbSheetName];
            const dbHeaders = ["날짜", "순위", "증감", "앱이름", "패키지명", "장르", "개발사(퍼블리셔)", "증감수치", "평점", "아이콘url"];
            if (!dbSheet) {
                // 새 시트는 열을 헤더 수만큼만 (기본 26열은 시트 전체 1천만 칸 한도를 낭비)
                dbSheet = await doc.addSheet({ title: dbSheetName, headerValues: dbHeaders, gridProperties: { rowCount: 2, columnCount: dbHeaders.length } });
                console.log(`  - 새 시트 생성: ${dbSheetName}`);
            }
            await dbSheet.loadHeaderRow();

            let previousRanks = {};
            let latestKnownScores = {};
            let latestKnownGenres = {};

            const cutoffStr = addDays(todayStr, -LOOKBACK_DAYS);
            const { rows, scanned, mode, limit } = await loadRecentRows(dbSheet, cutoffStr);
            snapAdd(dbSheetName, rows.map(rowToArr));
            console.log(`  - ${label}: 날짜열 ${scanned}행 스캔(${mode}) → 최근 ${rows.length}행 로드 (${cutoffStr} 이후)`);

            // 같은 날 두 번 돌아도(수동 실행 뒤 예약 실행 등) 오늘 순위가 두 벌 쌓이지 않게, 이미 있으면 건너뛴다
            const todayRowCount = rows.filter(r => r.get('날짜') === todayStr).length;
            if (todayRowCount > 0) {
                console.log(`  [건너뜀] ${label}: 오늘(${todayStr}) 행 ${todayRowCount}개가 이미 있습니다.`);
                return {};
            }

            let yesterdayRowCount = 0;
            for (const row of rows) {
                const rowDate = row.get('날짜');
                const appName = row.get('앱이름');
                let appId = row.get('패키지명');

                if (appId && appId.startsWith("'")) {
                    appId = appId.substring(1);
                }

                const rank = row.get('순위');
                const score = row.get('평점');
                const genre = row.get('장르');

                const keys = [];
                if (appId && appId.trim() !== '-' && appId.trim() !== '') keys.push(appId.trim());
                if (appName && appName.trim() !== '') keys.push(appName.trim());

                if (rowDate === yesterdayStr) yesterdayRowCount++;

                keys.forEach(k => {
                    if (rowDate === yesterdayStr && rank) {
                        previousRanks[k] = parseInt(rank, 10);
                    }
                    if (score && score !== '-' && score !== '0' && score !== '') {
                        latestKnownScores[k] = score;
                    }
                    if (genre && genre !== '기타') {
                        latestKnownGenres[k] = genre;
                    }
                });
            }

            if (yesterdayRowCount === 0) {
                console.warn(`  [경고] ${label}: 어제(${yesterdayStr}) 데이터가 없습니다. 증감이 전부 NEW로 기록됩니다.`);
            }

            const topGamesList = await gplay.list({
                category: gplay.category.GAME,
                collection: collectionType,
                num: 100,
                country: country.code,
                lang: country.lang
            });

            // 차트는 매일 100위까지 온다. 모자라면 기록은 하되 실행을 실패로 표시해 알림이 오게 한다
            if (topGamesList.length < EXPECTED_RANKS) {
                shortfalls.push(`${label} ${topGamesList.length}건 (기대 ${EXPECTED_RANKS}건)`);
            }

            const topGames = [], genreFails = [], genreFixed = [];
            process.stdout.write(`  - ${label} 장르, 평점 및 아이콘 데이터 수집 중...`);
            for (let i = 0; i < topGamesList.length; i += 10) {
                const chunk = topGamesList.slice(i, i + 10);
                const promises = chunk.map(async (game) => {
                    let rawScore = (typeof game.score === 'number' && game.score > 0) ? game.score : null;
                    let iconUrl = game.icon || '';

                    game.genre = null;
                    try {
                        const detail = await gplay.app({ appId: game.appId, country: country.code, lang: country.lang });
                        keepAppInfo(country, game.appId, game.title, detail);
                        // 장르: 한국은 받은 그대로(한국어), 해외는 genreId 를 한국어 분류명으로
                        game.genre = (country.lang === 'ko' ? detail.genre : GENRE_KO[detail.genreId]) || null;
                        if (detail.icon) {
                            iconUrl = detail.icon;
                        }
                        if (typeof detail.score === 'number' && detail.score > 0) {
                            rawScore = detail.score;
                        }
                    } catch (e) {
                        genreFails.push(`${game.title} (${game.appId}): ${e.message}`);
                        if (!infoOf(country.code)[game.appId]) await appInfoFromPage(country, game.appId, game.title);
                    }
                    if (!game.genre) {
                        game.genre = await genreFromPage(game.appId, country.code)
                            || latestKnownGenres[game.appId] || latestKnownGenres[game.title] || '기타';
                        genreFixed.push(`${game.title} → ${game.genre}`);
                    }

                    game.finalScore = (rawScore && rawScore > 0) ? rawScore.toFixed(1) : null;
                    game.iconUrl = iconUrl ? `'${iconUrl}` : `'-`;
                    return game;
                });
                const results = await Promise.all(promises);
                topGames.push(...results);
                process.stdout.write('.');
                await new Promise(r => setTimeout(r, 400));
            }
            console.log(" 완료!");
            if (genreFails.length) console.log(`  - 상세 조회 실패 ${genreFails.length}개:\n    ` + genreFails.join('\n    '));
            if (genreFixed.length) console.log(`  - 장르 폴백 ${genreFixed.length}개:\n    ` + genreFixed.join('\n    '));

            const dbRows = [];
            for (let i = 0; i < topGames.length; i++) {
                const rank = i + 1;
                const title = topGames[i].title;
                const appId = topGames[i].appId ? `'${topGames[i].appId}` : `'-`;
                const rawAppId = topGames[i].appId || '';
                const genre = topGames[i].genre;
                const developer = topGames[i].developer ? `'${topGames[i].developer}` : `'알 수 없음`; 
                const iconUrl = topGames[i].iconUrl;
                
                let score = topGames[i].finalScore;
                if (!score) {
                    score = latestKnownScores[rawAppId] || latestKnownScores[title] || '-';
                }
                
                let change = 'NEW';
                let numericDiff = '';

                const prevRank = previousRanks[rawAppId] || previousRanks[title];
                if (prevRank) {
                    const diff = prevRank - rank;
                    numericDiff = diff;

                    if (diff > 0) change = `▲ ${diff}`;
                    else if (diff < 0) change = `▼ ${Math.abs(diff)}`;
                    else change = '-';
                }

                dbRows.push({
                    "날짜": todayStr,
                    "순위": rank,
                    "증감": change,
                    "앱이름": title,
                    "패키지명": appId,
                    "장르": genre,
                    "개발사(퍼블리셔)": developer,
                    // "증감수치": numericDiff,
                    "평점": score,
                    "아이콘url": iconUrl
                });
            }

            if (dbRows.length > 0) {
                await dbSheet.addRows(dbRows);
                snapAdd(dbSheetName, dbRows.map(objToArr));
                console.log(`[완료] ${label} DB 시트에 데이터 기록 완료!`);
            }

            // 오늘 제대로 받은 장르: 패키지명·앱이름 → 장르 (과거 '기타' 행 보정용)
            const genreByKey = {};
            topGames.forEach(g => {
                if (!g.genre || g.genre === '기타') return;
                if (g.appId) genreByKey[g.appId] = g.genre;
                if (g.title) genreByKey[g.title.trim()] = g.genre;
            });
            return genreByKey;
        }

        /**
         * 과거 행 중 장르가 '기타'인데 같은 앱(패키지명, 패키지명이 없던 초기 행은 앱이름)의
         * 장르를 오늘 제대로 받았다면 그 장르로 바꾼다. 앱이름·패키지명·장르(D:F)만 읽고
         * 바꿀 칸만 저장한다. 이미 고친 행은 다음 실행에서 대상이 아니므로 하루 한 번 돌아도 안전하다.
         */
        async function backfillGenres(dbSheet, genreByKey) {
            const last = dbSheet.rowCount;
            if (last < 2) return 0;
            const cols = await dbSheet.getCellsInRange(`D2:F${last}`);
            const targets = [];
            (cols || []).forEach((r, i) => {
                if (!r || (r[2] || '').trim() !== '기타') return;
                const name = (r[0] || '').trim(), pkg = (r[1] || '').replace(/^'/, '').trim();
                const g = (pkg && genreByKey[pkg]) || genreByKey[name];
                if (g) targets.push([i + 2, g]);
            });
            if (!targets.length) return 0;
            await dbSheet.loadCells(`F${targets[0][0]}:F${targets[targets.length - 1][0]}`);
            targets.forEach(([row, g]) => { dbSheet.getCellByA1(`F${row}`).value = g; });
            await dbSheet.saveUpdatedCells();
            return targets.length;
        }

        /**
         * DB_앱정보: 게임당 한 줄. 기존 줄은 남기고(차트에서 빠진 게임도 상세는 볼 수 있게) 오늘 받은 게임만 최신으로 바꾼다.
         * 수백 줄이라 통째로 다시 쓴다 (설명 첫 글자가 '-'·'=' 이어도 수식으로 읽히지 않게 raw 로 기록).
         */
        // ── 앱스토어 (iOS) ─────────────────────────────────────────
        // 애플 예전 RSS 피드(게임 카테고리 6014)로 매출·무료 TOP 100, 조회 API 한 번(100개)으로 이름·장르·평점·설명·스크린샷.
        // 시트는 구글과 같은 10열: DB_매출순위_iOS (+ _US 등 나라 접미사), 패키지명 칸 = 번들 ID.
        // 장르는 애플 세부 장르 번호를 사이트의 한국어 분류명으로 (구글과 같은 이름이 되게).
        const APPLE_GENRE_KO = {
            7001: '액션', 7002: '어드벤처', 7003: '캐주얼', 7004: '보드', 7005: '카드', 7006: '카지노', 7007: '보드', 7008: '교육',
            7009: '캐주얼', 7011: '음악', 7012: '퍼즐', 7013: '레이싱', 7014: '롤플레잉', 7015: '시뮬레이션', 7016: '스포츠', 7017: '전략',
            7018: '퀴즈', 7019: '단어'
        };
        const APPLE_FEEDS = [['topfreeapplications', '인기순위'], ['topgrossingapplications', '매출순위']];
        // 애플 응답은 가끔 받는 도중 끊긴다(terminated) → 본문까지 다 읽는 것을 최대 3번 시도
        async function appleJson(url, tries = 3) {
            for (let i = 1; ; i++) {
                try {
                    const res = await fetch(url);
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    return await res.json();
                } catch (e) {
                    if (i >= tries) throw e;
                    await new Promise(r => setTimeout(r, 1500 * i));
                }
            }
        }
        async function appleLookup(ids, cc) {
            const out = new Map();
            for (let i = 0; i < ids.length; i += 100) {
                const j = await appleJson(`https://itunes.apple.com/lookup?id=${ids.slice(i, i + 100).join(',')}&country=${cc}`);
                (j.results || []).forEach(x => out.set(String(x.trackId), x));
            }
            return out;
        }
        async function processAppleChart(doc, todayStr, yesterdayStr, country, feed, sheetBase) {
            const dbSheetName = `DB_${sheetBase}_iOS${country.suffix}`, label = `${country.name} iOS ${sheetBase}`;
            const dbHeaders = ["날짜", "순위", "증감", "앱이름", "패키지명", "장르", "개발사(퍼블리셔)", "증감수치", "평점", "아이콘url"];
            let dbSheet = doc.sheetsByTitle[dbSheetName];
            if (!dbSheet) {
                dbSheet = await doc.addSheet({ title: dbSheetName, headerValues: dbHeaders, gridProperties: { rowCount: 2, columnCount: dbHeaders.length } });
                console.log(`  - 새 시트 생성: ${dbSheetName}`);
            }
            await dbSheet.loadHeaderRow();
            const { rows } = await loadRecentRows(dbSheet, addDays(todayStr, -LOOKBACK_DAYS));
            snapAdd(dbSheetName, rows.map(rowToArr));
            const todayRowCount = rows.filter(r => r.get('날짜') === todayStr).length;
            if (todayRowCount > 0) { console.log(`  [건너뜀] ${label}: 오늘(${todayStr}) 행 ${todayRowCount}개가 이미 있습니다.`); return; }
            const prev = {};
            rows.forEach(r => { if (r.get('날짜') === yesterdayStr) prev[String(r.get('패키지명') || '').replace(/^'/, '')] = parseInt(r.get('순위'), 10); });

            const entries = (await appleJson(`https://itunes.apple.com/${country.code}/rss/${feed}/limit=100/genre=6014/json`))?.feed?.entry || [];
            if (entries.length < EXPECTED_RANKS) shortfalls.push(`${label} ${entries.length}건 (기대 ${EXPECTED_RANKS}건)`);
            const info = await appleLookup(entries.map(e => e.id.attributes['im:id']), country.code);

            const dbRows = entries.map((e, i) => {
                const tid = e.id.attributes['im:id'], bundle = e.id.attributes['im:bundleId'], x = info.get(tid) || {};
                const rank = i + 1, pr = prev[bundle];
                let change = 'NEW';
                if (pr) { const d = pr - rank; change = d > 0 ? `▲ ${d}` : d < 0 ? `▼ ${-d}` : '-'; }
                const gid = (x.genreIds || []).map(Number).find(g => APPLE_GENRE_KO[g]);
                const title = x.trackName || e['im:name']?.label || '';
                const shots = (x.screenshotUrls && x.screenshotUrls.length ? x.screenshotUrls : x.ipadScreenshotUrls || []).slice(0, APPINFO_SHOTS);
                const desc = String(x.description || '').trim();
                if (desc || shots.length) infoOf(`ios:${country.code}`)[bundle] = { title, desc, shots };
                const icon = x.artworkUrl512 || (e['im:image'] || []).at(-1)?.label || '';
                return {
                    "날짜": todayStr, "순위": rank, "증감": change, "앱이름": title, "패키지명": `'${bundle}`,
                    "장르": APPLE_GENRE_KO[gid] || '기타', "개발사(퍼블리셔)": `'${x.artistName || e['im:artist']?.label || '알 수 없음'}`,
                    "평점": typeof x.averageUserRating === 'number' && x.averageUserRating > 0 ? x.averageUserRating.toFixed(1) : '-',
                    "아이콘url": icon ? `'${icon}` : `'-`
                };
            });
            if (dbRows.length) { await dbSheet.addRows(dbRows); snapAdd(dbSheetName, dbRows.map(objToArr)); console.log(`[완료] ${label} ${dbRows.length}행 기록 (조회 ${info.size}개)`); }
        }

        async function saveAppInfo(doc, todayStr, country, ios = false) {
            const sheetName = APPINFO_SHEET + (ios ? '_iOS' : '') + country.suffix, info = infoOf((ios ? 'ios:' : '') + country.code);
            const ids = Object.keys(info);
            if (!ids.length) { console.log(`  - ${sheetName}: 저장할 앱 정보 없음`); return; }
            let sh = doc.sheetsByTitle[sheetName];
            if (!sh) sh = await doc.addSheet({ title: sheetName, headerValues: APPINFO_HEADERS, gridProperties: { rowCount: 2, columnCount: APPINFO_HEADERS.length } });
            await sh.loadHeaderRow();
            const all = new Map();
            for (const r of await sh.getRows()) {
                const id = String(r.get('패키지명') || '').trim();
                if (id) all.set(id, Object.fromEntries(APPINFO_HEADERS.map(h => [h, r.get(h) ?? ''])));
            }
            const before = all.size;
            ids.forEach(id => {
                const a = info[id];
                all.set(id, { '패키지명': id, '앱이름': a.title, '설명': a.desc, '스크린샷': a.shots.join('\n'), '갱신일': todayStr });
            });
            await sh.clearRows();
            await sh.addRows([...all.values()], { raw: true });
            console.log(`  - ${sheetName}: ${ids.length}개 갱신 · 전체 ${all.size}개 (새로 추가 ${all.size - before}개)`);
        }

        /** 수동 실행(appinfo_only): 지금 두 차트의 게임 상세만 받아 앱 정보를 채운다. 순위 시트는 읽지도 쓰지도 않음 */
        async function fillAppInfoOnly(doc, todayStr) {
            for (const country of COUNTRIES) {
              try { await fillAppInfoCountry(doc, todayStr, country); }
              catch (e) { console.warn(`  [경고] ${country.name} 앱 정보 실패: ${e.message}`); }
            }
        }
        async function fillAppInfoCountry(doc, todayStr, country) {
            console.log(`  [${country.name}]`);
            const seen = new Map();
            for (const collection of [gplay.collection.TOP_FREE, gplay.collection.GROSSING]) {
                const list = await gplay.list({ category: gplay.category.GAME, collection, num: 100, country: country.code, lang: country.lang });
                list.forEach(g => { if (g.appId && !seen.has(g.appId)) seen.set(g.appId, g.title); });
            }
            const entries = [...seen.entries()], fails = [], fixed = [];
            process.stdout.write(`  - 상세 조회 ${entries.length}개 `);
            for (let i = 0; i < entries.length; i += 10) {
                await Promise.all(entries.slice(i, i + 10).map(async ([appId, title]) => {
                    try { keepAppInfo(country, appId, title, await gplay.app({ appId, country: country.code, lang: country.lang })); }
                    catch (e) {
                        if (await appInfoFromPage(country, appId, title)) fixed.push(title);
                        else fails.push(`${title} (${appId}): ${e.message}`);
                    }
                }));
                process.stdout.write('.');
                await new Promise(r => setTimeout(r, 400));
            }
            console.log(' 완료!');
            if (fixed.length) console.log(`  - 스토어 페이지로 보완 ${fixed.length}개: ${fixed.join(', ')}`);
            if (fails.length) console.log(`  - 앱 정보 없음 ${fails.length}개:\n    ` + fails.join('\n    '));
            await saveAppInfo(doc, todayStr, country);
        }

        async function main() {
            const creds = JSON.parse(process.env.GCP_CREDENTIALS);
            const serviceAccountAuth = new JWT({
                email: creds.client_email,
                key: creds.private_key,
                scopes: ['https://www.googleapis.com/auth/spreadsheets'],
            });

            const sheetUrl = process.env.SHEET_URL;
            const docId = sheetUrl.match(/\/d\/([a-zA-Z0-9-_]+)/)[1];
            const doc = new GoogleSpreadsheet(docId, serviceAccountAuth);
            await doc.loadInfo();

            const now = new Date(new Date().getTime() + 9 * 60 * 60 * 1000); 
            const todayStr = now.toISOString().split('T')[0];
            const yesterdayStr = new Date(now.getTime() - 24 * 60 * 60 * 1000).toISOString().split('T')[0];

            if (process.env.APPINFO_ONLY === '1') {
                console.log("=== 앱 정보만 채우기 (순위 수집 안 함) ===");
                await fillAppInfoOnly(doc, todayStr);
                return;
            }

            // 1~2. 나라별 인기·매출 순위 (한국 먼저). 한 나라가 실패해도 나머지는 계속하고, 끝에서 실행을 실패로 표시
            const genreByKey = {}, failures = [];
            for (const country of COUNTRIES) {
                console.log(`\n=== ${country.name}(${country.code}) 인기순위 · 매출순위 수집 ===`);
                for (const [collection, suffix] of [[gplay.collection.TOP_FREE, '인기순위'], [gplay.collection.GROSSING, '매출순위']]) {
                    try {
                        Object.assign(genreByKey, await processCategory(doc, docId, todayStr, yesterdayStr, collection, suffix, country));
                    } catch (e) {
                        failures.push(`${country.name} ${suffix}: ${e.message}`);
                        console.error(`  [실패] ${country.name} ${suffix}: ${e.message}`);
                    }
                }
            }

            // 2-b. 앱스토어: 나라별 무료(인기)·매출. 실패해도 구글 기록에는 영향 없고 끝에서 실패로 표시
            for (const country of COUNTRIES) {
                console.log(`\n=== ${country.name}(${country.code}) 앱스토어 인기순위 · 매출순위 수집 ===`);
                for (const [feed, base] of APPLE_FEEDS) {
                    try {
                        await processAppleChart(doc, todayStr, yesterdayStr, country, feed, base);
                    } catch (e) {
                        failures.push(`${country.name} iOS ${base}: ${e.message}`);
                        console.error(`  [실패] ${country.name} iOS ${base}: ${e.message}`);
                    }
                }
            }

            // 3. 모든 나라에서 받은 장르를 합쳐 과거 '기타' 행 보정 (장르는 패키지 단위라 나라와 무관)
            // 보정 실패가 오늘 수집 결과에는 영향을 주지 않도록 따로 잡는다
            console.log("\n=== 3. 과거 '기타' 장르 보정 ===");
            await doc.loadInfo();   // 오늘 행이 붙은 뒤의 행 수로 갱신
            for (const name of COUNTRIES.flatMap(c => [`DB_인기순위${c.suffix}`, `DB_매출순위${c.suffix}`])) {
                if (!doc.sheetsByTitle[name]) continue;
                try {
                    const n = await backfillGenres(doc.sheetsByTitle[name], genreByKey);
                    console.log(`  - ${name}: ${n}행 보정`);
                } catch (e) {
                    console.warn(`  [경고] ${name} 장르 보정 실패: ${e.message}`);
                }
            }

            // 4. 게임 설명·스크린샷 (실패해도 순위 기록은 이미 끝났으므로 경고만)
            console.log("\n=== 4. 앱 정보(설명·스크린샷) 저장 ===");
            await doc.loadInfo();
            for (const country of COUNTRIES) {
                for (const ios of [false, true]) {
                    try {
                        await saveAppInfo(doc, todayStr, country, ios);
                    } catch (e) {
                        console.warn(`  [경고] ${APPINFO_SHEET}${ios ? '_iOS' : ''}${country.suffix} 저장 실패: ${e.message}`);
                    }
                }
            }

            // 5. 사이트용 스냅샷 (실패해도 수집 결과에는 영향 없음)
            console.log("\n=== 5. 사이트용 스냅샷 ===");
            try { exportSnapshot(todayStr); } catch (e) { console.warn(`  [경고] 스냅샷 저장 실패: ${e.message}`); }

            if (failures.length) console.error(`[실패] 수집 오류: ${failures.join(' · ')}`);
            if (shortfalls.length) console.error(`[실패] 순위 수집 건수 부족: ${shortfalls.join(' · ')}`);
            if (failures.length || shortfalls.length) process.exit(1);
        }

        main().catch(e => { console.error(e); process.exit(1); });
        EOF
        
        node run.js

    - name: 저장소 활동 기록 (스케줄 자동 비활성화 방지)
      if: always()
      run: |
        mkdir -p .github
        date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/.keepalive-rank
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add .github/.keepalive-rank data/snapshot.json data/version.json 2>/dev/null || git add .github/.keepalive-rank
        git diff --cached --quiet && exit 0
        git commit -m "chore: keepalive (rank) + 사이트용 스냅샷"
        pushed=0
        for i in 1 2 3 4 5; do
          git pull --rebase --autostash && git push && { pushed=1; break; }
          echo "push 재시도 $i/5"; sleep $((i * 15 + RANDOM % 10))
        done
        [ "$pushed" = 1 ] || { echo "::error::스냅샷 push 실패 — 사이트가 어제 스냅샷·캐시를 계속 씀. 이 워크플로를 다시 실행하세요"; exit 1; }
        # Pages 배포 확인: 사이트가 읽는 version.json 이 이번 값으로 바뀔 때까지 (최대 약 8분)
        [ -f data/version.json ] || exit 0
        want=$(cat data/version.json)
        for i in $(seq 1 32); do
          [ "$(curl -s "https://jdpark618.github.io/gchart/data/version.json?t=$RANDOM$i")" = "$want" ] && { echo "Pages 반영 확인 (${i}회째)"; exit 0; }
          sleep 15
        done
        echo "::error::Pages 에 스냅샷이 반영되지 않음 — GitHub Pages 배포 상태를 확인하세요"; exit 1
