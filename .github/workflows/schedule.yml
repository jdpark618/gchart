name: Daily PlayStore Rank Scraper

on:
  schedule:
    # UTC 20:42 = 한국 시간 다음 날 05:42
    # wame 크롤러(20:12)와 30분 간격을 둬 keepalive push 충돌을 피한다
    - cron: '42 20 * * *'
  workflow_dispatch:
    inputs:
      appinfo_only:
        description: '앱 정보(설명·스크린샷)만 채우기 — 순위 수집·기록은 하지 않음'
        type: boolean
        default: false

permissions:
  contents: write   # keepalive 커밋을 push 하기 위해 필요

# 이전 실행이 안 끝났는데 새로 뜨는 상황 방지 (중복 적재 차단)
concurrency:
  group: playstore-rank-scraper
  cancel-in-progress: false

jobs:
  scrape-and-update:
    # ubuntu-latest는 2026-10-19부터 Ubuntu 26으로 자동 전환됨
    runs-on: ubuntu-24.04

    steps:
    - name: 저장소 체크아웃
      uses: actions/checkout@v5

    - name: Node.js 환경 설정
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        # 이 저장소엔 package.json/lock 파일이 없으므로 자동 캐싱을 끈다
        package-manager-cache: false

    - name: 라이브러리 설치
      run: npm install google-play-scraper@9.2.0 google-spreadsheet@5.3.0 google-auth-library

    - name: 스크립트 강제 생성 및 실행
      env:
        GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        SHEET_URL: ${{ secrets.SHEET_URL }}
        APPINFO_ONLY: ${{ inputs.appinfo_only && '1' || '' }}
      run: |
        cat << 'EOF' > run.js
        const { GoogleSpreadsheet } = require('google-spreadsheet');
        const { JWT } = require('google-auth-library');
        const gplay = require('google-play-scraper');

        // ── 조회 윈도우 설정 ──────────────────────────────────────
        // 필요한 과거 데이터는 두 가지뿐이다.
        //   1) 증감 계산용 = 어제 1일치
        //   2) 평점 폴백용 = 최근 이력 중 유효한 마지막 값
        // 따라서 DB 전체가 아니라 최근 LOOKBACK_DAYS 일치만 읽는다.
        const LOOKBACK_DAYS = 14;
        const ROWS_PER_DAY = 100;

        // ── 앱 정보 (게임 설명·스크린샷) ──────────────────────────
        // 순위 수집 때 받은 상세 조회 결과에서 설명·스크린샷만 모아 DB_앱정보 시트에 게임당 한 줄로 저장한다.
        // 사이트의 게임 상세 창이 패키지명으로 한 줄만 읽어 간다. 순위 시트와는 따로라 실패해도 순위 기록에 영향 없음.
        const APPINFO_SHEET = 'DB_앱정보';
        const APPINFO_HEADERS = ['패키지명', '앱이름', '설명', '스크린샷', '갱신일'];
        const APPINFO_SHOTS = 6;
        const appInfo = {};
        function keepAppInfo(appId, title, detail) {
            if (!appId || !detail) return;
            const shots = (detail.screenshots || []).filter(u => typeof u === 'string' && u.startsWith('http')).slice(0, APPINFO_SHOTS);
            const desc = String(detail.description || '').trim();
            if (desc || shots.length) appInfo[appId] = { title, desc, shots };
        }
        // 상세 조회가 실패하는 게임(장르 폴백과 같은 게임들)은 스토어 페이지에서 직접 읽는다.
        // 설명 = data-g-id="description" 블록(<br> → 줄바꿈), 스크린샷 = alt="스크린샷 이미지" 인 이미지 (크기 접미사 뗀 주소)
        function decodeHtml(t) {
            return t.replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '')
                .replace(/&#(\d+);/g, (_, n) => String.fromCodePoint(+n)).replace(/&#x([0-9a-f]+);/gi, (_, n) => String.fromCodePoint(parseInt(n, 16)))
                .replace(/&quot;/g, '"').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&');
        }
        async function appInfoFromPage(appId, title) {
            try {
                const res = await fetch(`https://play.google.com/store/apps/details?id=${encodeURIComponent(appId)}&hl=ko&gl=kr`);
                if (!res.ok) return false;
                const html = await res.text();
                const m = html.match(/data-g-id="description"[^>]*>([\s\S]*?)<\/div>/);
                const desc = m ? decodeHtml(m[1]).trim() : '';
                const shots = [...new Set([...html.matchAll(/<img src="(https:\/\/play-lh\.googleusercontent\.com\/[^"=]+)=[^"]*"[^>]*alt="스크린샷 이미지"/g)].map(x => x[1]))].slice(0, APPINFO_SHOTS);
                if (!desc && !shots.length) return false;
                appInfo[appId] = { title, desc, shots };
                return true;
            } catch (e) {
                return false;
            }
        }

        // ── 장르 폴백 ──────────────────────────────────────────────
        // gplay.app 상세 조회가 일부 게임(주로 청소년 이용불가 MMO)에서 매번 실패해
        // 장르가 '기타'로 쌓였다. 상세 조회가 실패하면 스토어 페이지의 applicationCategory를
        // 직접 읽고, 그래도 없으면 최근 이력의 마지막 장르를 쓴다.
        const GENRE_KO = {
            GAME_ACTION: '액션', GAME_ADVENTURE: '어드벤처', GAME_ARCADE: '아케이드', GAME_BOARD: '보드',
            GAME_CARD: '카드', GAME_CASINO: '카지노', GAME_CASUAL: '캐주얼', GAME_EDUCATIONAL: '교육',
            GAME_MUSIC: '음악', GAME_PUZZLE: '퍼즐', GAME_RACING: '레이싱', GAME_ROLE_PLAYING: '롤플레잉',
            GAME_SIMULATION: '시뮬레이션', GAME_SPORTS: '스포츠', GAME_STRATEGY: '전략', GAME_TRIVIA: '퀴즈', GAME_WORD: '단어'
        };
        async function genreFromPage(appId) {
            try {
                const res = await fetch(`https://play.google.com/store/apps/details?id=${encodeURIComponent(appId)}&hl=ko&gl=kr`);
                if (!res.ok) return null;
                const m = (await res.text()).match(/"applicationCategory":"(GAME_[A-Z_]+)"/);
                return m ? (GENRE_KO[m[1]] || null) : null;
            } catch (e) {
                return null;
            }
        }

        function addDays(dateStr, delta) {
            const d = new Date(`${dateStr}T00:00:00Z`);
            d.setUTCDate(d.getUTCDate() + delta);
            return d.toISOString().split('T')[0];
        }

        /**
         * 날짜 컬럼(A)만 먼저 읽어 윈도우의 시작 위치를 찾은 뒤,
         * 그 구간의 행만 getRows로 가져온다.
         * 시트 끝부분만 탐침하고, 탐침 범위가 부족하면 전체 스캔으로 폴백한다.
         */
        async function loadRecentRows(dbSheet, cutoffStr) {
            const gridRows = dbSheet.rowCount;
            if (gridRows < 2) return { rows: [], scanned: 0, mode: 'empty' };

            const probeRows = LOOKBACK_DAYS * ROWS_PER_DAY * 2 + 200;
            let startRow = Math.max(2, gridRows - probeRows);
            let dateCol = null;
            let mode = 'probe';

            if (startRow > 2) {
                dateCol = await dbSheet.getCellsInRange(`A${startRow}:A${gridRows}`);
                const first = (dateCol && dateCol[0] && dateCol[0][0]) ? dateCol[0][0] : '';
                // 탐침 구간이 비었거나(데이터가 훨씬 앞에서 끝남),
                // 구간 시작이 이미 cutoff 이후라면(충분히 과거까지 못 감) 전체 스캔
                if (!dateCol || dateCol.length === 0 || first > cutoffStr) {
                    dateCol = null;
                }
            }

            if (!dateCol) {
                startRow = 2;
                mode = 'full';
                dateCol = await dbSheet.getCellsInRange(`A2:A${gridRows}`);
            }

            if (!dateCol || dateCol.length === 0) return { rows: [], scanned: 0, mode: 'empty' };

            let idx = dateCol.findIndex(r => ((r && r[0]) ? r[0] : '') >= cutoffStr);
            if (idx === -1) {
                // cutoff 이후 데이터가 전혀 없음 → 최소한 끝부분만 확보
                idx = Math.max(0, dateCol.length - ROWS_PER_DAY * 2);
            }

            const offset = (startRow - 2) + idx;
            const limit = dateCol.length - idx;
            const rows = await dbSheet.getRows({ offset, limit });

            return { rows, scanned: dateCol.length, mode, offset, limit };
        }

        const EXPECTED_RANKS = 100;
        const shortfalls = [];   // 수집 건수가 모자란 차트 (main 끝에서 실패 처리)

        async function processCategory(doc, docId, todayStr, yesterdayStr, collectionType, sheetNameSuffix) {
            const dbSheetName = `DB_${sheetNameSuffix}`;

            let dbSheet = doc.sheetsByTitle[dbSheetName];
            const dbHeaders = ["날짜", "순위", "증감", "앱이름", "패키지명", "장르", "개발사(퍼블리셔)", "증감수치", "평점", "아이콘url"];
            if (!dbSheet) {
                dbSheet = await doc.addSheet({ title: dbSheetName, headerValues: dbHeaders });
            }
            await dbSheet.loadHeaderRow();

            let previousRanks = {};
            let latestKnownScores = {};
            let latestKnownGenres = {};

            const cutoffStr = addDays(todayStr, -LOOKBACK_DAYS);
            const { rows, scanned, mode, limit } = await loadRecentRows(dbSheet, cutoffStr);
            console.log(`  - ${sheetNameSuffix}: 날짜열 ${scanned}행 스캔(${mode}) → 최근 ${rows.length}행 로드 (${cutoffStr} 이후)`);

            // 같은 날 두 번 돌아도(수동 실행 뒤 예약 실행 등) 오늘 순위가 두 벌 쌓이지 않게, 이미 있으면 건너뛴다
            const todayRowCount = rows.filter(r => r.get('날짜') === todayStr).length;
            if (todayRowCount > 0) {
                console.log(`  [건너뜀] ${sheetNameSuffix}: 오늘(${todayStr}) 행 ${todayRowCount}개가 이미 있습니다.`);
                return {};
            }

            let yesterdayRowCount = 0;
            for (const row of rows) {
                const rowDate = row.get('날짜');
                const appName = row.get('앱이름');
                let appId = row.get('패키지명');

                if (appId && appId.startsWith("'")) {
                    appId = appId.substring(1);
                }

                const rank = row.get('순위');
                const score = row.get('평점');
                const genre = row.get('장르');

                const keys = [];
                if (appId && appId.trim() !== '-' && appId.trim() !== '') keys.push(appId.trim());
                if (appName && appName.trim() !== '') keys.push(appName.trim());

                if (rowDate === yesterdayStr) yesterdayRowCount++;

                keys.forEach(k => {
                    if (rowDate === yesterdayStr && rank) {
                        previousRanks[k] = parseInt(rank, 10);
                    }
                    if (score && score !== '-' && score !== '0' && score !== '') {
                        latestKnownScores[k] = score;
                    }
                    if (genre && genre !== '기타') {
                        latestKnownGenres[k] = genre;
                    }
                });
            }

            if (yesterdayRowCount === 0) {
                console.warn(`  [경고] ${sheetNameSuffix}: 어제(${yesterdayStr}) 데이터가 없습니다. 증감이 전부 NEW로 기록됩니다.`);
            }

            const topGamesList = await gplay.list({
                category: gplay.category.GAME,
                collection: collectionType,
                num: 100,
                country: 'kr',
                lang: 'ko'
            });

            // 차트는 매일 100위까지 온다. 모자라면 기록은 하되 실행을 실패로 표시해 알림이 오게 한다
            if (topGamesList.length < EXPECTED_RANKS) {
                shortfalls.push(`${sheetNameSuffix} ${topGamesList.length}건 (기대 ${EXPECTED_RANKS}건)`);
            }

            const topGames = [], genreFails = [], genreFixed = [];
            process.stdout.write(`  - ${sheetNameSuffix} 장르, 평점 및 아이콘 데이터 수집 중...`);
            for (let i = 0; i < topGamesList.length; i += 10) {
                const chunk = topGamesList.slice(i, i + 10);
                const promises = chunk.map(async (game) => {
                    let rawScore = (typeof game.score === 'number' && game.score > 0) ? game.score : null;
                    let iconUrl = game.icon || '';

                    game.genre = null;
                    try {
                        const detail = await gplay.app({ appId: game.appId, country: 'kr', lang: 'ko' });
                        keepAppInfo(game.appId, game.title, detail);
                        game.genre = detail.genre || null;
                        if (detail.icon) {
                            iconUrl = detail.icon;
                        }
                        if (typeof detail.score === 'number' && detail.score > 0) {
                            rawScore = detail.score;
                        }
                    } catch (e) {
                        genreFails.push(`${game.title} (${game.appId}): ${e.message}`);
                        await appInfoFromPage(game.appId, game.title);
                    }
                    if (!game.genre) {
                        game.genre = await genreFromPage(game.appId)
                            || latestKnownGenres[game.appId] || latestKnownGenres[game.title] || '기타';
                        genreFixed.push(`${game.title} → ${game.genre}`);
                    }

                    game.finalScore = (rawScore && rawScore > 0) ? rawScore.toFixed(1) : null;
                    game.iconUrl = iconUrl ? `'${iconUrl}` : `'-`;
                    return game;
                });
                const results = await Promise.all(promises);
                topGames.push(...results);
                process.stdout.write('.');
                await new Promise(r => setTimeout(r, 400));
            }
            console.log(" 완료!");
            if (genreFails.length) console.log(`  - 상세 조회 실패 ${genreFails.length}개:\n    ` + genreFails.join('\n    '));
            if (genreFixed.length) console.log(`  - 장르 폴백 ${genreFixed.length}개:\n    ` + genreFixed.join('\n    '));

            const dbRows = [];
            for (let i = 0; i < topGames.length; i++) {
                const rank = i + 1;
                const title = topGames[i].title;
                const appId = topGames[i].appId ? `'${topGames[i].appId}` : `'-`;
                const rawAppId = topGames[i].appId || '';
                const genre = topGames[i].genre;
                const developer = topGames[i].developer ? `'${topGames[i].developer}` : `'알 수 없음`; 
                const iconUrl = topGames[i].iconUrl;
                
                let score = topGames[i].finalScore;
                if (!score) {
                    score = latestKnownScores[rawAppId] || latestKnownScores[title] || '-';
                }
                
                let change = 'NEW';
                let numericDiff = '';

                const prevRank = previousRanks[rawAppId] || previousRanks[title];
                if (prevRank) {
                    const diff = prevRank - rank;
                    numericDiff = diff;

                    if (diff > 0) change = `▲ ${diff}`;
                    else if (diff < 0) change = `▼ ${Math.abs(diff)}`;
                    else change = '-';
                }

                dbRows.push({
                    "날짜": todayStr,
                    "순위": rank,
                    "증감": change,
                    "앱이름": title,
                    "패키지명": appId,
                    "장르": genre,
                    "개발사(퍼블리셔)": developer,
                    // "증감수치": numericDiff,
                    "평점": score,
                    "아이콘url": iconUrl
                });
            }

            if (dbRows.length > 0) {
                await dbSheet.addRows(dbRows);
                console.log(`[완료] ${sheetNameSuffix} DB 시트에 데이터 기록 완료!`);
            }

            // 오늘 제대로 받은 장르: 패키지명·앱이름 → 장르 (과거 '기타' 행 보정용)
            const genreByKey = {};
            topGames.forEach(g => {
                if (!g.genre || g.genre === '기타') return;
                if (g.appId) genreByKey[g.appId] = g.genre;
                if (g.title) genreByKey[g.title.trim()] = g.genre;
            });
            return genreByKey;
        }

        /**
         * 과거 행 중 장르가 '기타'인데 같은 앱(패키지명, 패키지명이 없던 초기 행은 앱이름)의
         * 장르를 오늘 제대로 받았다면 그 장르로 바꾼다. 앱이름·패키지명·장르(D:F)만 읽고
         * 바꿀 칸만 저장한다. 이미 고친 행은 다음 실행에서 대상이 아니므로 하루 한 번 돌아도 안전하다.
         */
        async function backfillGenres(dbSheet, genreByKey) {
            const last = dbSheet.rowCount;
            if (last < 2) return 0;
            const cols = await dbSheet.getCellsInRange(`D2:F${last}`);
            const targets = [];
            (cols || []).forEach((r, i) => {
                if (!r || (r[2] || '').trim() !== '기타') return;
                const name = (r[0] || '').trim(), pkg = (r[1] || '').replace(/^'/, '').trim();
                const g = (pkg && genreByKey[pkg]) || genreByKey[name];
                if (g) targets.push([i + 2, g]);
            });
            if (!targets.length) return 0;
            await dbSheet.loadCells(`F${targets[0][0]}:F${targets[targets.length - 1][0]}`);
            targets.forEach(([row, g]) => { dbSheet.getCellByA1(`F${row}`).value = g; });
            await dbSheet.saveUpdatedCells();
            return targets.length;
        }

        /**
         * DB_앱정보: 게임당 한 줄. 기존 줄은 남기고(차트에서 빠진 게임도 상세는 볼 수 있게) 오늘 받은 게임만 최신으로 바꾼다.
         * 수백 줄이라 통째로 다시 쓴다 (설명 첫 글자가 '-'·'=' 이어도 수식으로 읽히지 않게 raw 로 기록).
         */
        async function saveAppInfo(doc, todayStr) {
            const ids = Object.keys(appInfo);
            if (!ids.length) { console.log('  - 저장할 앱 정보 없음'); return; }
            let sh = doc.sheetsByTitle[APPINFO_SHEET];
            if (!sh) sh = await doc.addSheet({ title: APPINFO_SHEET, headerValues: APPINFO_HEADERS, gridProperties: { rowCount: 2, columnCount: APPINFO_HEADERS.length } });
            await sh.loadHeaderRow();
            const all = new Map();
            for (const r of await sh.getRows()) {
                const id = String(r.get('패키지명') || '').trim();
                if (id) all.set(id, Object.fromEntries(APPINFO_HEADERS.map(h => [h, r.get(h) ?? ''])));
            }
            const before = all.size;
            ids.forEach(id => {
                const a = appInfo[id];
                all.set(id, { '패키지명': id, '앱이름': a.title, '설명': a.desc, '스크린샷': a.shots.join('\n'), '갱신일': todayStr });
            });
            await sh.clearRows();
            await sh.addRows([...all.values()], { raw: true });
            console.log(`  - ${APPINFO_SHEET}: ${ids.length}개 갱신 · 전체 ${all.size}개 (새로 추가 ${all.size - before}개)`);
        }

        /** 수동 실행(appinfo_only): 지금 두 차트의 게임 상세만 받아 앱 정보를 채운다. 순위 시트는 읽지도 쓰지도 않음 */
        async function fillAppInfoOnly(doc, todayStr) {
            const seen = new Map();
            for (const collection of [gplay.collection.TOP_FREE, gplay.collection.GROSSING]) {
                const list = await gplay.list({ category: gplay.category.GAME, collection, num: 100, country: 'kr', lang: 'ko' });
                list.forEach(g => { if (g.appId && !seen.has(g.appId)) seen.set(g.appId, g.title); });
            }
            const entries = [...seen.entries()], fails = [], fixed = [];
            process.stdout.write(`  - 상세 조회 ${entries.length}개 `);
            for (let i = 0; i < entries.length; i += 10) {
                await Promise.all(entries.slice(i, i + 10).map(async ([appId, title]) => {
                    try { keepAppInfo(appId, title, await gplay.app({ appId, country: 'kr', lang: 'ko' })); }
                    catch (e) {
                        if (await appInfoFromPage(appId, title)) fixed.push(title);
                        else fails.push(`${title} (${appId}): ${e.message}`);
                    }
                }));
                process.stdout.write('.');
                await new Promise(r => setTimeout(r, 400));
            }
            console.log(' 완료!');
            if (fixed.length) console.log(`  - 스토어 페이지로 보완 ${fixed.length}개: ${fixed.join(', ')}`);
            if (fails.length) console.log(`  - 앱 정보 없음 ${fails.length}개:\n    ` + fails.join('\n    '));
            await saveAppInfo(doc, todayStr);
        }

        async function main() {
            const creds = JSON.parse(process.env.GCP_CREDENTIALS);
            const serviceAccountAuth = new JWT({
                email: creds.client_email,
                key: creds.private_key,
                scopes: ['https://www.googleapis.com/auth/spreadsheets'],
            });

            const sheetUrl = process.env.SHEET_URL;
            const docId = sheetUrl.match(/\/d\/([a-zA-Z0-9-_]+)/)[1];
            const doc = new GoogleSpreadsheet(docId, serviceAccountAuth);
            await doc.loadInfo();

            const now = new Date(new Date().getTime() + 9 * 60 * 60 * 1000); 
            const todayStr = now.toISOString().split('T')[0];
            const yesterdayStr = new Date(now.getTime() - 24 * 60 * 60 * 1000).toISOString().split('T')[0];

            if (process.env.APPINFO_ONLY === '1') {
                console.log("=== 앱 정보만 채우기 (순위 수집 안 함) ===");
                await fillAppInfoOnly(doc, todayStr);
                return;
            }

            console.log("=== 1. 게임 인기순위 수집 시작 ===");
            const popGenres = await processCategory(doc, docId, todayStr, yesterdayStr, gplay.collection.TOP_FREE, '인기순위');

            console.log("\n=== 2. 게임 매출순위 수집 시작 ===");
            const salesGenres = await processCategory(doc, docId, todayStr, yesterdayStr, gplay.collection.GROSSING, '매출순위');

            // 3. 두 시트에서 받은 장르를 합쳐 과거 '기타' 행 보정 (한쪽 차트에만 있는 게임도 다른 시트 이력까지 고침)
            // 보정 실패가 오늘 수집 결과에는 영향을 주지 않도록 따로 잡는다
            console.log("\n=== 3. 과거 '기타' 장르 보정 ===");
            const genreByKey = { ...popGenres, ...salesGenres };
            await doc.loadInfo();   // 오늘 행이 붙은 뒤의 행 수로 갱신
            for (const name of ['DB_인기순위', 'DB_매출순위']) {
                try {
                    const n = await backfillGenres(doc.sheetsByTitle[name], genreByKey);
                    console.log(`  - ${name}: ${n}행 보정`);
                } catch (e) {
                    console.warn(`  [경고] ${name} 장르 보정 실패: ${e.message}`);
                }
            }

            // 4. 게임 설명·스크린샷 (실패해도 순위 기록은 이미 끝났으므로 경고만)
            console.log("\n=== 4. 앱 정보(설명·스크린샷) 저장 ===");
            try {
                await doc.loadInfo();
                await saveAppInfo(doc, todayStr);
            } catch (e) {
                console.warn(`  [경고] ${APPINFO_SHEET} 저장 실패: ${e.message}`);
            }

            if (shortfalls.length) {
                console.error(`[실패] 순위 수집 건수 부족: ${shortfalls.join(' · ')}`);
                process.exit(1);
            }
        }

        main().catch(e => { console.error(e); process.exit(1); });
        EOF
        
        node run.js

    - name: 저장소 활동 기록 (스케줄 자동 비활성화 방지)
      if: always()
      run: |
        mkdir -p .github
        date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/.keepalive-rank
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add .github/.keepalive-rank
        git diff --cached --quiet && exit 0
        git commit -m "chore: keepalive (rank)"
        for i in 1 2 3; do
          git pull --rebase --autostash && git push && exit 0
          sleep $((RANDOM % 10 + 5))
        done
        echo "keepalive push 실패 (본 작업에는 영향 없음)"
